services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in an untracked .env file}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - contactflow-sqldata:/var/opt/mssql

volumes:
  contactflow-sqldata:
